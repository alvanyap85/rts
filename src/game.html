<title>冷锋 Cold Front</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="only dark">
<meta name="darkreader-lock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: landscape battlefield canvas filling the screen, gunmetal command sidebar on the right
   (credits, power, radar, build grid), floating command buttons over the map. Single dark look by choice. */
:root {
  --bg: #0b0f12;
  --panel: #161d23;
  --panel2: #1f2931;
  --line: #34424e;
  --fg: #e4ecf1;
  --muted: #8797a4;
  --amber: #ffb43a;
  --ok: #5fd27c;
  --bad: #ff5b4b;
  --team: #3d9bff;
  --font: 'Chakra Petch', system-ui, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  color-scheme: only dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font-family: var(--font); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

#app { position: fixed; inset: 0; display: flex; background: var(--bg); }
#map { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#side {
  width: calc(clamp(148px, 20vw, 216px) + env(safe-area-inset-right, 0px));
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) 6px 6px;
  background: linear-gradient(180deg, #1a232a 0%, #10161b 100%);
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 5px; min-height: 0;
}
.cred { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
#cred { font-size: 19px; font-weight: 700; color: var(--amber); font-variant-numeric: tabular-nums; letter-spacing: .03em; text-shadow: 0 0 8px rgba(255,180,58,.35); }
#clock { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pwr { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); letter-spacing: .06em; }
.pwr .bar { position: relative; flex: 1; height: 6px; background: #05080a; border: 1px solid var(--line); }
.pwr .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); }
.pwr .bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); }
.pwr.low .bar i { background: var(--bad); }
.pwr.low span { color: var(--bad); }
#mini { width: 100%; aspect-ratio: 2 / 1; display: block; background: #000; border: 1px solid var(--line); image-rendering: pixelated; touch-action: none; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tabs button {
  height: 26px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  font-size: 12px; font-weight: 600; letter-spacing: .08em; border-radius: 2px; position: relative;
}
.tabs button[aria-selected="true"] { background: var(--panel2); color: var(--amber); border-color: #5b4a2a; }
.tabs button.ping::after { content: ''; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
#grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-content: start; }
.bb {
  position: relative; aspect-ratio: 4 / 3; padding: 0; overflow: hidden; border-radius: 2px;
  border: 1px solid var(--line); background: #0c1216; color: var(--fg); touch-action: manipulation;
}
.bb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bb .ov { position: absolute; inset: 0; background: conic-gradient(transparent calc(var(--p, 0) * 1turn), rgba(0,0,0,.62) 0); }
.bb .nm { position: absolute; left: 3px; bottom: 1px; font-size: 10px; font-weight: 600; text-shadow: 0 1px 2px #000, 0 0 3px #000; white-space: nowrap; }
.bb .ct { position: absolute; right: 3px; top: 1px; font-size: 10px; font-weight: 600; color: var(--amber); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.bb .q { position: absolute; left: 3px; top: 2px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; background: var(--amber); color: #1a1000; font-size: 11px; font-weight: 700; line-height: 16px; }
.bb .st { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--amber); text-shadow: 0 0 6px #000, 0 1px 2px #000; }
.bb.locked { filter: grayscale(1) brightness(.4); }
.bb.busy { filter: brightness(.55); }
.bb.ready { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.bb.ready .st { animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }

.fbtns { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); bottom: 8px; display: flex; gap: 6px; }
.fb {
  min-width: 54px; height: 38px; padding: 0 10px; border-radius: 3px; border: 1px solid var(--line);
  background: rgba(16,22,27,.82); color: var(--fg); font-size: 13px; font-weight: 600; letter-spacing: .05em;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); touch-action: manipulation;
}
.fb[aria-pressed="true"] { background: #3a2c10; border-color: var(--amber); color: var(--amber); }
.fb.go { background: #173f22; border-color: var(--ok); color: #c9f5d5; }
#menuBtn { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); top: 8px; min-width: 38px; padding: 0; }
#actBar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 6px; }
.fb.warn { background: #4a1712; border-color: var(--bad); color: #ffd3cc; }
#placeBar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 8px; }
#selInfo { position: absolute; right: 8px; bottom: 54px; font-size: 12px; color: var(--muted); background: rgba(10,14,17,.7); padding: 3px 8px; border-radius: 2px; pointer-events: none; }
#msgs { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
#msgs div {
  font-size: 13px; font-weight: 600; letter-spacing: .12em; color: var(--amber); background: rgba(8,10,12,.72);
  border-left: 2px solid var(--amber); padding: 3px 12px; white-space: nowrap; animation: msgIn .2s ease-out;
}
#msgs div.bad { color: #ffb0a6; border-color: var(--bad); }
@keyframes msgIn { from { opacity: 0; transform: translateY(-6px); } }

.scr {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: safe center;
  gap: 14px; padding-block: 20px; overflow-y: auto; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(90% 70% at 50% 40%, rgba(40,52,62,.88) 0%, rgba(6,9,11,.96) 70%);
}
.scr h1 { margin: 0; font-size: clamp(44px, 9vw, 84px); line-height: .95; font-weight: 700; letter-spacing: .12em; color: var(--amber); text-shadow: 0 0 22px rgba(255,180,58,.35), 0 3px 0 #5a3c08; }
.scr h1 small { display: block; font-size: .28em; letter-spacing: .6em; color: var(--fg); text-shadow: none; margin-top: 8px; padding-left: .6em; }
.scr h2 { margin: 0; font-size: clamp(32px, 6vw, 54px); letter-spacing: .2em; padding-left: .2em; }
.scr h2.win { color: var(--ok); }
.scr h2.lose { color: var(--bad); }
.scr p { margin: 0; color: var(--muted); font-size: 14px; max-width: 46ch; line-height: 1.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.big {
  min-width: 150px; height: 46px; padding: 0 22px; border-radius: 3px; border: 1px solid #a8741d;
  background: linear-gradient(180deg, #ffc659 0%, #f09a1c 100%); color: #2a1700; font-size: 17px; font-weight: 700; letter-spacing: .14em;
  box-shadow: 0 3px 0 #7a4c08;
}
.big.alt { background: var(--panel2); color: var(--fg); border-color: var(--line); box-shadow: 0 3px 0 #05080a; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { height: 34px; min-width: 72px; border: 0; background: var(--panel); color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--amber); }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 18px; max-width: 640px; width: 100%; text-align: left; font-size: 12px; color: var(--muted); }
.help b { color: var(--fg); font-weight: 600; }
.stats { display: grid; grid-template-columns: auto auto; gap: 4px 24px; font-size: 14px; text-align: left; font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); }
#rotate { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; text-align: center; background: var(--bg); color: var(--fg); font-size: 18px; letter-spacing: .1em; }
@media (orientation: portrait) and (max-width: 700px) { #rotate { display: grid; } }
@media (prefers-reduced-motion: reduce) { .bb.ready .st, #msgs div { animation: none; } }
</style>

<div id="app">
  <div id="map">
    <canvas id="cv"></canvas>
    <div id="msgs" aria-live="polite"></div>
    <button class="fb" id="menuBtn" aria-label="暂停">II</button>
    <div class="fbtns">
      <button class="fb" id="allBtn">全军</button>
    </div>
    <div id="actBar" hidden>
      <button class="fb go" id="deployBtn" hidden>展开</button>
      <button class="fb" id="stopBtn" hidden>停止</button>
      <button class="fb" id="repairBtn" hidden aria-pressed="false">维修</button>
      <button class="fb" id="sellBtn" hidden>出售</button>
      <button class="fb" id="desBtn">取消选择</button>
    </div>
    <div id="placeBar" hidden>
      <button class="fb go" id="placeOk">放置</button>
      <button class="fb" id="placeNo">取消</button>
    </div>
    <div id="selInfo" hidden></div>
  </div>
  <aside id="side">
    <div class="cred"><div id="cred">$0</div><div id="clock">00:00</div></div>
    <div class="pwr" id="pwr"><span>电力</span><div class="bar"><i></i><b></b></div><span id="pwrTxt">0</span></div>
    <canvas id="mini" width="240" height="120"></canvas>
    <div class="tabs" role="tablist">
      <button id="tabB" role="tab" aria-selected="true">建筑</button>
      <button id="tabU" role="tab" aria-selected="false">部队</button>
    </div>
    <div id="grid"></div>
  </aside>
</div>

<div class="scr" id="title">
  <h1>冷锋<small>COLD FRONT</small></h1>
  <p>采矿、建基地、爆兵，推平对面的基地。一局大约十分钟。</p>
  <div class="seg" id="diff">
    <button data-d="0" aria-pressed="false">简单</button>
    <button data-d="1" aria-pressed="true">普通</button>
    <button data-d="2" aria-pressed="false">困难</button>
  </div>
  <div class="row"><button class="big" id="startBtn">开始作战</button></div>
  <div class="help">
    <div><b>选部队：</b>点一下单位；双击选同类；按住地面不放，等圆圈出现后拖动就是框选</div>
    <div><b>下命令：</b>选中后点地面移动，点敌人攻击，点矿区采矿</div>
    <div><b>看地图：</b>单指拖动平移（可以甩），双指缩放，点右侧小地图跳转</div>
    <div><b>造东西：</b>点右侧图标开始建造，完成后再点一下放到地图上；长按图标取消。点自己的建筑可以维修或出售</div>
  </div>
</div>

<div class="scr" id="pause" hidden>
  <h2>暂停</h2>
  <div class="row">
    <button class="big" id="resumeBtn">继续</button>
    <button class="big alt" id="restartBtn">重新开始</button>
    <button class="big alt" id="quitBtn">返回标题</button>
  </div>
</div>

<div class="scr" id="end" hidden>
  <h2 id="endTitle">胜利</h2>
  <div class="stats" id="endStats"></div>
  <div class="row">
    <button class="big" id="againBtn">再来一局</button>
    <button class="big alt" id="endQuitBtn">返回标题</button>
  </div>
</div>

<div id="rotate">请把手机横过来</div>

<script>
(() => {
'use strict';

// ============================================================ constants & definitions
const T = 32, MW = 72, MH = 48, N = MW * MH;
const DT = 1 / 30;
const TEAM = [
  { main: '#3d9bff', dark: '#1b4f8e', light: '#a6d4ff', mini: '#4fb0ff' },
  { main: '#e4463a', dark: '#7d1d16', light: '#ffab9f', mini: '#ff5544' },
];
const ARM = { inf: 0, heavy: 1, bld: 2 };

const BDEF = {
  hq:       { name: '建造厂',   w: 3, h: 3, hp: 2400, power: 20,  cost: 0,    time: 0,  sight: 8, H: 26 },
  power:    { name: '发电厂',   w: 2, h: 2, hp: 750,  power: 100, cost: 300,  time: 7,  sight: 4, H: 32 },
  refinery: { name: '精炼厂',   w: 3, h: 2, hp: 1100, power: -30, cost: 1500, time: 13, sight: 5, H: 26, req: ['power'] },
  barracks: { name: '兵营',     w: 2, h: 2, hp: 850,  power: -20, cost: 400,  time: 8,  sight: 5, H: 19, req: ['power'] },
  factory:  { name: '战车工厂', w: 3, h: 3, hp: 1500, power: -30, cost: 1500, time: 15, sight: 5, H: 27, req: ['refinery'] },
  turret:   { name: '哨戒炮',   w: 1, h: 1, hp: 800,  power: -20, cost: 600,  time: 9,  sight: 8, H: 15, req: ['barracks'], weapon: 'turretgun', range: 7.5 },
};
const UDEF = {
  rifle:  { name: '步枪兵',   cat: 'inf', from: 'barracks', cost: 100,  time: 3.5, hp: 125, armor: 'inf',   speed: 34, r: 5,  range: 4.5, sight: 6, weapon: 'rifle' },
  rocket: { name: '火箭兵',   cat: 'inf', from: 'barracks', cost: 250,  time: 6,   hp: 110, armor: 'inf',   speed: 30, r: 5,  range: 6,   sight: 7, weapon: 'rocket' },
  tank:   { name: '主战坦克', cat: 'veh', from: 'factory',  cost: 800,  time: 11,  hp: 480, armor: 'heavy', speed: 52, r: 11, range: 5.5, sight: 7, weapon: 'cannon', turn: 3.2 },
  mcv:    { name: '基地车',   cat: 'veh', from: 'factory',  cost: 3000, time: 25,  hp: 1000, armor: 'heavy', speed: 30, r: 15, range: 0, sight: 6, turn: 2 },
  harv:   { name: '采矿车',   cat: 'veh', from: 'factory',  cost: 1200, time: 12,  hp: 900, armor: 'heavy', speed: 40, r: 13, range: 0,   sight: 5, turn: 2.6 },
};
// vs = damage multiplier against [infantry, heavy armor, buildings]
const WDEF = {
  rifle:     { dmg: 15, rof: 0.8, kind: 'bullet', vs: [1, 0.22, 0.3], snd: 'rifle' },
  rocket:    { dmg: 52, rof: 2.2, kind: 'rocket', speed: 230, vs: [0.3, 1.1, 0.8], snd: 'rocket', splash: 10 },
  cannon:    { dmg: 64, rof: 2.0, kind: 'shell', speed: 420, vs: [0.55, 1, 0.85], snd: 'cannon', splash: 14 },
  turretgun: { dmg: 56, rof: 1.5, kind: 'shell', speed: 480, vs: [0.8, 1, 0.5], snd: 'cannon', splash: 12 },
};
const BUILD_LIST = ['power', 'refinery', 'barracks', 'factory', 'turret'];
const UNIT_LIST = ['rifle', 'rocket', 'tank', 'harv', 'mcv'];
const HARV_CAP = 800;
const DIFF = [
  { name: '简单', firstAttack: 300, wave: 4, waveGrow: 1, waveMax: 10, gap: 110, prod: 0.75, startCredits: 5000 },
  { name: '普通', firstAttack: 210, wave: 6, waveGrow: 2, waveMax: 16, gap: 80,  prod: 1,    startCredits: 5000 },
  { name: '困难', firstAttack: 150, wave: 7, waveGrow: 3, waveMax: 24, gap: 60,  prod: 1.3,  startCredits: 7000 },
];

// ============================================================ helpers
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const turnTo = (a, b, max) => { const d = angDiff(a, b); return Math.abs(d) <= max ? b : a + Math.sign(d) * max; };
const tIdx = (x, y) => (y | 0) * MW + (x | 0);
const tileOf = (px, py) => clamp(Math.floor(py / T), 0, MH - 1) * MW + clamp(Math.floor(px / T), 0, MW - 1);
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const s = t => t * t * (3 - 2 * t);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, s(xf)), lerp(c, d, s(xf)), s(yf));
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

// ============================================================ map
let terr, ore, oreMax, bmap;
const isWalk = i => terr[i] === 0 && bmap[i] < 0;
const START = [{ tx: 7, ty: 36 }, { tx: MW - 10, ty: MH - 39 }]; // HQ top-left tiles (point-symmetric)

function genMap() {
  terr = new Uint8Array(N); ore = new Uint16Array(N); oreMax = new Uint16Array(N); bmap = new Int32Array(N).fill(-1);
  // river along the diagonal, point-symmetric about the centre, with three fords
  const L = Math.hypot(MW, MH), nx = -MH / L, ny = MW / L, pts = [];
  for (let k = 0; k <= 160; k++) {
    const s = k / 160, o = Math.sin(s * Math.PI * 2) * 4.5 + Math.sin(s * Math.PI * 4) * 1.6;
    pts.push([s * MW + nx * o, s * MH + ny * o, s]);
  }
  const ford = s => Math.abs(s - 0.5) < 0.035 || Math.abs(s - 0.21) < 0.026 || Math.abs(s - 0.79) < 0.026;
  const riverD = new Float32Array(N);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    let best = 1e9, bs = 0;
    for (const p of pts) { const d = (p[0] - x - .5) ** 2 + (p[1] - y - .5) ** 2; if (d < best) { best = d; bs = p[2]; } }
    best = Math.sqrt(best); riverD[y * MW + x] = best;
    if (best < 1.7 && !ford(bs)) terr[y * MW + x] = 2;
  }
  const baseC = START.map(s => [s.tx + 1.5, s.ty + 1.5]);
  const nearBase = (x, y, r) => baseC.some(b => Math.hypot(b[0] - x, b[1] - y) < r);
  const blob = (cx, cy, r, f) => {
    for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) {
      if (x < 0 || y < 0 || x >= MW || y >= MH) continue;
      f(x, y, Math.hypot(x + .5 - cx, y + .5 - cy) / r);
    }
  };
  // ore fields: one close to each base, one further back, a rich one toward the middle
  const fields = [[17.5, 40.5, 3.4, 1], [6.5, 26.5, 3, 1], [27, 34.5, 3.6, 1.5], [44, 43.5, 2.8, 1.1], [3.5, 14, 2.6, 1.2]];
  for (const [fx, fy, r, rich] of fields) for (const [cx, cy] of [[fx, fy], [MW - fx, MH - fy]]) {
    blob(cx, cy, r, (x, y, d) => {
      const i = y * MW + x; const j = (MH - 1 - y) * MW + (MW - 1 - x);
      if (d > 1 - hash2(x * 3, y * 7) * 0.25 || terr[i] || terr[j]) return;
      const a = Math.round((260 + 340 * (1 - d) * rich + hash2(x, y) * 80) / 10) * 10;
      ore[i] = Math.max(ore[i], a); oreMax[i] = ore[i];
    });
  }
  // rocks, placed in mirrored pairs away from bases, ore and the river
  let placed = 0, tries = 0;
  while (placed < 11 && tries++ < 400) {
    const x = 3 + rnd() * (MW - 6), y = 3 + rnd() * (MH - 6), r = 1.1 + rnd() * 1.6;
    if (nearBase(x, y, 11) || nearBase(MW - x, MH - y, 11)) continue;
    const ti = tIdx(x, y); if (riverD[ti] < 4 || Math.abs(x / MW - y / MH) < 0.05) continue;
    let clash = false; blob(x, y, r + 1.5, (xx, yy) => { if (ore[yy * MW + xx]) clash = true; }); if (clash) continue;

    let p = 0, st = '', cls = 'bb', q = 0;
    const locked = !canBuild(tm, b.type);
    if (BDEF[b.type]) {
      if (tm.bq && tm.bq.type === b.type) { p = tm.bq.prog; if (tm.bq.ready) { st = '就绪'; cls += ' ready'; p = 1; } }
      else if (tm.bq) cls += ' busy';
    } else {
      const cat = UDEF[b.type].cat, qq = tm.q[cat];
      q = qq.filter(t => t === b.type).length;
      if (qq[0] === b.type && tm.qp[cat]) p = tm.qp[cat].prog;
    }
    if (locked && !(BDEF[b.type] && tm.bq && tm.bq.type === b.type)) cls += ' locked';
    const key = cls + '|' + (p * 60 | 0) + '|' + st + '|' + q;
    if (key === b.last) continue; b.last = key;
    b.el.className = cls;
    b.ov.style.setProperty('--p', (p > 0 && p < 1) ? p.toFixed(3) : (p >= 1 ? 1 : 1));
    b.ov.style.display = p > 0 && p < 1 ? '' : 'none';
    b.st.textContent = st;
    b.q.hidden = !q; b.q.textContent = q;
  }
}
const credEl = document.getElementById('cred'), clockEl = document.getElementById('clock'), pwrEl = document.getElementById('pwr'), pwrTxt = document.getElementById('pwrTxt');
let shownCred = 0;
function updateHUD(dt) {
  const tm = G.teams[0];
  const diff = tm.credits - shownCred; shownCred += Math.abs(diff) < 2 ? diff : diff * Math.min(1, dt * 8);
  credEl.textContent = '$' + Math.floor(shownCred);
  const s = G.t | 0; clockEl.textContent = String(s / 60 | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  const max = Math.max(tm.powerP, tm.powerU, 100);
  pwrEl.querySelector('i').style.width = (tm.powerU / max * 100) + '%';
  pwrEl.querySelector('b').style.left = (tm.powerP / max * 100) + '%';
  pwrEl.classList.toggle('low', tm.low);
  pwrTxt.textContent = `${tm.powerP - tm.powerU}`;
}

// messages
const msgBox = document.getElementById('msgs');
function say(text, bad) {
  if (G && G.teams[0].ai) return;
  const last = msgBox.lastElementChild; if (last && last.textContent === text) return;
  const d = document.createElement('div'); d.textContent = text; if (bad) d.className = 'bad';
  msgBox.append(d); while (msgBox.children.length > 3) msgBox.firstElementChild.remove();
  setTimeout(() => d.remove(), 2600);
}

// ============================================================ audio (all synthesized)
let AC = null, master = null, noiseBuf = null;
const lastSnd = {};
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function sfx(name, x, y) {
  if (!AC || AC.state !== 'running' || (G && G.demo)) return;
  const now = AC.currentTime;
  const gap = { rifle: 0.06, cannon: 0.08, rocket: 0.08, boom: 0.07, die: 0.1 }[name] || 0.03;
  if (now - (lastSnd[name] || 0) < gap) return; lastSnd[name] = now;
  let vol = 1;
  if (x !== undefined) {
    const cx = cam.x + view.w / cam.z / 2, cy = cam.y + view.h / cam.z / 2;
    const d = Math.hypot(x - cx, y - cy) / (view.w / cam.z);
    vol = clamp(1.2 - d, 0.08, 1);
  }
  const out = AC.createGain(); out.gain.value = vol; out.connect(master);
  const noise = (dur, type, f0, f1, g0, q = 1) => {
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 1;
    const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, now); f.frequency.exponentialRampToValueAtTime(f1, now + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(g0, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(now, Math.random() * 0.5); s.stop(now + dur + 0.02);
  };
  const tone = (dur, type, f0, f1, g0, delay = 0) => {
    const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, now + delay); o.frequency.exponentialRampToValueAtTime(f1, now + delay + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, now + delay); g.gain.linearRampToValueAtTime(g0, now + delay + 0.01); g.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
    o.connect(g); g.connect(out); o.start(now + delay); o.stop(now + delay + dur + 0.02);
  };
  switch (name) {
    case 'rifle': noise(0.07, 'bandpass', 2400, 900, 0.35, 1.2); break;
    case 'cannon': noise(0.28, 'lowpass', 1400, 120, 0.7); tone(0.2, 'sine', 140, 45, 0.5); break;
    case 'rocket': noise(0.35, 'bandpass', 700, 2600, 0.35, 2); break;
    case 'boom': noise(0.6, 'lowpass', 900, 60, 0.8); tone(0.4, 'sine', 90, 30, 0.6); break;
    case 'bigboom': noise(1.2, 'lowpass', 700, 40, 1); tone(0.9, 'sine', 70, 22, 0.8); break;
    case 'die': noise(0.12, 'bandpass', 600, 300, 0.2, 3); break;
    case 'click': tone(0.04, 'square', 1200, 900, 0.08); break;
    case 'ack': tone(0.05, 'square', 700, 700, 0.07); tone(0.05, 'square', 1050, 1050, 0.07, 0.06); break;
    case 'deny': tone(0.16, 'square', 180, 140, 0.12); break;
    case 'cancel': tone(0.1, 'triangle', 600, 300, 0.15); break;
    case 'ready': tone(0.12, 'triangle', 660, 660, 0.2); tone(0.18, 'triangle', 990, 990, 0.2, 0.12); break;
    case 'unit': tone(0.08, 'triangle', 520, 520, 0.12); tone(0.1, 'triangle', 780, 780, 0.12, 0.08); break;
    case 'place': noise(0.25, 'lowpass', 500, 80, 0.6); tone(0.2, 'sine', 110, 50, 0.4); break;
    case 'alert': for (let k = 0; k < 3; k++) tone(0.12, 'sawtooth', 880, 620, 0.09, k * 0.18); break;
  }
}

// ============================================================ screens & loop
const titleEl = document.getElementById('title'), pauseEl = document.getElementById('pause'), endEl = document.getElementById('end');
document.querySelectorAll('#diff button').forEach(b => b.addEventListener('click', () => {
  difficulty = +b.dataset.d;
  document.querySelectorAll('#diff button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  try { localStorage.setItem('coldfront.diff', difficulty); } catch (e) {}
}));
try { const d = localStorage.getItem('coldfront.diff'); if (d !== null) document.querySelector(`#diff button[data-d="${d}"]`)?.click(); } catch (e) {}
function start() {
  audioInit();
  titleEl.hidden = true; endEl.hidden = true; pauseEl.hidden = true;
  newGame(); paused = false; setTab('b');
}
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('againBtn').addEventListener('click', start);
document.getElementById('restartBtn').addEventListener('click', start);
const toTitle = () => { pauseEl.hidden = true; endEl.hidden = true; titleEl.hidden = false; if (!G || !G.demo) startDemo(); };
document.getElementById('quitBtn').addEventListener('click', toTitle);
document.getElementById('endQuitBtn').addEventListener('click', toTitle);
document.getElementById('menuBtn').addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
function togglePause() { if (!G || G.over || G.demo) return; paused = !paused; pauseEl.hidden = !paused; }
function showEnd() {
  if (!G || !G.over) return;
  if (G.demo) { startDemo(); return; }
  paused = true;
  const tm = G.teams[0], s = G.t | 0;
  document.getElementById('endTitle').textContent = G.over === 'win' ? '胜利' : '战败';
  document.getElementById('endTitle').className = G.over === 'win' ? 'win' : 'lose';
  document.getElementById('endStats').innerHTML =
    `<span>用时</span><b>${s / 60 | 0} 分 ${s % 60} 秒</b>` +
    `<span>消灭敌军</span><b>${tm.kills}</b>` +
    `<span>损失单位</span><b>${tm.lostU}</b>` +
    `<span>损失建筑</span><b>${tm.lostB}</b>` +
    `<span>采矿收入</span><b>$${tm.mined}</b>`;
  endEl.hidden = false;
}

addEventListener('resize', () => { if (G) resize(); });
let lastT = performance.now(), acc = 0, uiT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (!G) return;
  if (!paused) {
    acc += dt;
    let n = 0; while (acc >= DT && n < 4) { step(); acc -= DT; n++; }
    if (n === 4) acc = 0;
    // keyboard panning
    const sp = 700 / cam.z * dt;
    if (keys.has('arrowleft') || keys.has('a')) cam.x -= sp;
    if (keys.has('arrowright') || keys.has('d')) cam.x += sp;
    if (keys.has('arrowup') || keys.has('w')) cam.y -= sp;
    if (keys.has('arrowdown') || keys.has('s')) cam.y += sp;
    if (!gesture && (camVel.x || camVel.y)) {
      cam.x += camVel.x * dt; cam.y += camVel.y * dt; clampCam();
      const k = Math.exp(-6 * dt); camVel.x *= k; camVel.y *= k;
      if (Math.hypot(camVel.x, camVel.y) < 8) camVel.x = camVel.y = 0;
    }
    clampCam();
    if (G.demo) demoCam(dt);
  }
  render();
  uiT -= dt;
  if (uiT <= 0) { uiT = 0.1; updateGrid(); refreshSelUI(); }
  updateHUD(dt);
  miniT -= dt; if (miniT <= 0) { miniT = 0.25; renderMini(); }
}
requestAnimationFrame(frame);

// a live AI-vs-AI battle runs behind the title screen
function startDemo() {
  autoPlayer = true; newGame(); autoPlayer = false; G.demo = true; paused = false;
  cam.z = defaultZoom() * 0.8; clampCam();
}
function demoCam(dt) {
  const army = G.ents.filter(e => e.kind === 'u' && e.type !== 'harv');
  if (!army.length) return;
  // follow the unit group furthest from its own base: that's where the fighting is
  let best = null, bd = -1;
  for (const u of army) { const s = START[u.team]; const d = Math.hypot(u.x - (s.tx + 1.5) * T, u.y - (s.ty + 1.5) * T); if (d > bd) { bd = d; best = u; } }
  const [bix, biy] = P(best.x, best.y), tx = bix - view.w / cam.z / 2, ty = biy - view.h / cam.z / 2;
  cam.x += (tx - cam.x) * Math.min(1, dt * 0.4); cam.y += (ty - cam.y) * Math.min(1, dt * 0.4); clampCam();
}
startDemo();
toTitle();
paused = false;

// test hooks
window.__cf = {
  get G() { return G; }, step, newGame, runAI,
  setAuto(v) { autoPlayer = v; },
  fast(n) { for (let i = 0; i < n && !G.over; i++) step(); },
  setDifficulty(d) { difficulty = d; },
};
window.__cam = (x, y) => centerOn(x, y);
window.__zoom = z => { cam.z = z; clampCam(); };
window.__camPos = () => ({ x: cam.x, y: cam.y });
window.__sprTime = () => { SPR.clear(); const out = {}; for (const n of ['hq','power','refinery','barracks','factory','turretBase']) { const t = performance.now(); bldSpr(n, 0); out[n] = +(performance.now() - t).toFixed(1); } for (const n of ['tank','turret','harv','mcv','gun']) { const t = performance.now(); for (let d = 0; d < 32; d++) unitSpr(n, 0, d / 32 * Math.PI * 2); out[n + 'x32'] = +(performance.now() - t).toFixed(1); } return out; };
window.__w2s = (x, y) => { const r = cv.getBoundingClientRect(); const [ix, iy] = P(x, y, 6); return { x: r.left + (ix - cam.x) * cam.z, y: r.top + (iy - cam.y) * cam.z }; };
})();
